name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Controles de distribución sin hardware
        shell: pwsh
        run: ./scripts/test-distribution.ps1
      - name: Pruebas sin hardware ni catálogo personal
        shell: pwsh
        run: ./scripts/build-windows.ps1 -TestOnly
      - name: Compilar Wallet Studio
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Preparar paquete portable
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Draft
      # Repositorio público: no publicar binarios, ZIP ni artefactos comerciales.
      # La entrega definitiva se prepara localmente y se sube a Shopify a mano.

