services:
  wallet-cloud:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - wallet-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  wallet-data:
