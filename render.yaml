# Free compute only. Durable accounts and private objects MUST reside remotely.
# Never use ephemeral SQLite/blob files as the production source of truth.
services:
  - type: web
    name: wallet-studio-accounts
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8766"
      # Preserve the existing value during migration; replacing it revokes sessions.
      - key: WALLET_AUTH_SECRET
        sync: false
      - key: WALLET_STORAGE_MODE
        value: remote
      - key: DATABASE_URL
        sync: false
      - key: WALLET_OBJECT_STORAGE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: R2_BACKUP_BUCKET
        value: wallet-private
      - key: R2_DESIGN_BUCKET
        value: wallet-designs
      - key: WALLET_MAX_CONCURRENT_REQUESTS
        value: "1"
      - key: SHOPIFY_SHOP_DOMAIN
        value: store-09240616prrz2-itsdpkjq.myshopify.com
      - key: SHOPIFY_PRODUCT_IDS
        value: "10459984298313"
      - key: SHOPIFY_APP_PRODUCT_IDS
        value: "10459984298313"
      - key: SHOPIFY_BUNDLE_PRODUCT_IDS
        value: ""
      - key: SHOPIFY_PACK_PRODUCT_IDS
        value: ""
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Wallet Studio
